<head>

     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs e Layout</title>
</head>
<body>

    <h1>Divs e Spans</h1>

    <!-- Divisão de conteúdo -->
    <div>
        <h2>Meu conteúdo</h2>
        <p>Texto dentro de uma divisão.</p>
    </div>

    <!-- Outra div simples -->
    <div>
        <p>Outra div sem classe ou id.</p>
    </div>

    <!-- Span inline dentro de um parágrafo -->
    <p>Texto com <span>span inline</span> dentro da frase.</p>

    <br>

</body>
