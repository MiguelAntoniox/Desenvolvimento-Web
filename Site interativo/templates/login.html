<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial_scale=1.0">
    <title> Login </title>
    
</head>


<body>
    <div>
        <h1> Login </h1>
        <h2> Bem-vindo por favor, faça login para continuar. </h2>
    </div>
    

    <img src= "{{ url_for('static', filename='imagens/fotoperfil.png') }} " alt="Imagem do gestor de usuarios" width="300" height="250">

    
    <div>
        <form action="/login" method="POST">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="senha">Senha:</label>
            <input type="senha" id="senha" name="senha" required>
            <br>
            <input type="submit" value="Entrar">
            <button> <a href="/cadastro">Cadastrar</a> </button>
        </form>
    </div>



</body>
</html>
